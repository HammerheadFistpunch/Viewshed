name: Patch KMZ packaging guard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch KMZ packaging guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("aprs_viewshed_utah_parallel.py")
          s = p.read_text(encoding="utf-8")

          old = '''    for stype, folder, arc_name, png_path in ordered_results:\n        if arc_name is not None:\n            kmz_overlays.append((arc_name, png_path))\n        (digi_folders if stype == "digi" else igate_folders).append(folder)\n'''
          new = '''    for stype, folder, arc_name, png_path in ordered_results:\n        if arc_name is not None and png_path is not None:\n            overlay_path = Path(png_path)\n            if overlay_path.exists():\n                kmz_overlays.append((arc_name, overlay_path))\n            else:\n                print(f"   Warning: station overlay missing; skipping {arc_name}: {overlay_path}")\n        (digi_folders if stype == "digi" else igate_folders).append(folder)\n'''
          if old not in s:
              raise SystemExit("station overlay target not found")
          s = s.replace(old, new, 1)

          old2 = '''    print("   Writing KMZ archive...", end=" ", flush=True)\n    kmz_path = work_dir.parent / cfg["output_kmz"]\n    with zipfile.ZipFile(kmz_path, "w", zipfile.ZIP_DEFLATED) as zf:\n        zf.writestr("doc.kml", kml)\n        zf.write(png_path,    "coverage_overlay.png")\n        zf.write(legend_path, "legend.png")\n        for arc_name, file_path in kmz_overlays:\n            zf.write(file_path, arc_name)\n'''
          new2 = '''    print("   Writing KMZ archive...", end=" ", flush=True)\n    kmz_path = work_dir.parent / cfg["output_kmz"]\n\n    # Guard the archive boundary: zipfile.write() raises an opaque TypeError\n    # when an optional renderer returns None. Prefer the known work-dir paths\n    # when available, and fail with a useful diagnostic only if the required\n    # overlay really is absent.\n    png_path = Path(png_path) if png_path is not None else work_dir / "coverage_overlay.png"\n    legend_path = Path(legend_path) if legend_path is not None else work_dir / "legend.png"\n    if not png_path.is_file():\n        raise RuntimeError(f"Required coverage overlay PNG was not created: {png_path}")\n    if not legend_path.is_file():\n        raise RuntimeError(f"Required legend PNG was not created: {legend_path}")\n\n    with zipfile.ZipFile(kmz_path, "w", zipfile.ZIP_DEFLATED) as zf:\n        zf.writestr("doc.kml", kml)\n        zf.write(str(png_path), "coverage_overlay.png")\n        zf.write(str(legend_path), "legend.png")\n        for arc_name, file_path in kmz_overlays:\n            if file_path is None:\n                print(f"   Warning: skipping optional KMZ overlay with no file: {arc_name}")\n                continue\n            file_path = Path(file_path)\n            if not file_path.is_file():\n                print(f"   Warning: skipping missing optional KMZ overlay {arc_name}: {file_path}")\n                continue\n            zf.write(str(file_path), arc_name)\n'''
          if old2 not in s:
              raise SystemExit("KMZ archive target not found")
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aprs_viewshed_utah_parallel.py
          git rm .github/workflows/patch-kmz-guard.yml
          git commit -m "Guard KMZ packaging against missing overlay paths"
          git push origin HEAD:main

      - name: Trigger Windows build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-windows.yml --repo "$GITHUB_REPOSITORY" --ref main
